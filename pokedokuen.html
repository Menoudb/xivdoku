<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéDoku has moved!</title>

<meta http-equiv="refresh" content="5; url=https://poke.doku.gg/en/">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at top,#1e293b 0%,#0f172a 45%,#020617 100%);
  font-family:Inter,system-ui,sans-serif;
  color:#fff;
  overflow:hidden;
}

.bg{
  position:fixed;
  inset:0;
  opacity:.06;
  background-image:
    linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);
  background-size:32px 32px;
}

.card{
  position:relative;
  z-index:2;
  width:min(92vw,620px);
  background:rgba(15,23,42,.92);
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  padding:42px;
  text-align:center;
  box-shadow:
    0 20px 60px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(12px);
}

.logo{
  font-size:56px;
  margin-bottom:18px;
}

h1{
  font-size:40px;
  line-height:1;
  margin-bottom:16px;
  font-weight:900;
  letter-spacing:-1px;
}

p{
  color:#cbd5e1;
  font-size:18px;
  line-height:1.6;
  margin-bottom:14px;
}

.url{
  display:inline-block;
  margin:18px 0 28px;
  padding:14px 22px;
  border-radius:16px;
  background:#111827;
  border:1px solid rgba(255,255,255,.08);
  font-family:monospace;
  font-size:16px;
  color:#facc15;
  word-break:break-word;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:#facc15;
  color:#111827;
  text-decoration:none;
  font-weight:900;
  font-size:18px;
  padding:16px 28px;
  border-radius:18px;
  transition:transform .15s ease,box-shadow .15s ease;
  box-shadow:0 10px 30px rgba(250,204,21,.25);
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 40px rgba(250,204,21,.35);
}

.small{
  margin-top:26px;
  font-size:14px;
  color:#64748b;
}

.spinner{
  width:26px;
  height:26px;
  border:3px solid rgba(255,255,255,.18);
  border-top-color:#facc15;
  border-radius:50%;
  margin:22px auto 0;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="card">

  <div class="logo">🎮</div>

  <h1>PokéDoku has moved!</h1>

  <p>
    The website is now available on a new, faster and cleaner address.
  </p>

  <div class="url">
    https://poke.doku.gg/en/
  </div>

  <br>

  <a class="btn" href="https://poke.doku.gg/en/">
    Visit the new website
  </a>

  <div class="spinner"></div>

  <div class="small">
    Automatic redirect in a few seconds…
  </div>

</div>

</body>
</html>
