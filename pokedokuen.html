const TXT={"title": "PokéDoku", "subtitle": "Find Pokémon matching each category.", "placeholder": "Type a Pokémon name…", "check": "Validate", "newgame": "New puzzle", "giveup": "Reveal", "playagain": "Play again", "score": "Score", "errors": "Errors", "solved": "Solved", "wrong": "This Pokémon does not match this category.", "duplicate": "Already used in this puzzle.", "empty": "Choose a Pokémon first.", "win": "Perfect! You completed the grid.", "answer": "Answer", "matches": "valid answers", "search": "Search", "all": "All Pokémon", "stats": "Stats", "height": "Height", "weight": "Weight", "types": "Types", "abilities": "Abilities", "eggs": "Egg groups", "evolution": "Evolution", "gen": "Gen", "hidden": "Hidden ability", "cross": "Row + column", "note": "A Pokémon can be used only once per grid.", "is_ok_for": "matches", "but": "but", "does_not_match": "does not match", "possible_answers": "Possible answers", "all_possible": "All possible Pokémon", "generations": "Generations", "apply": "Apply"}; const ALL_POKEMON=JSON.parse(document.getElementById('pokemon-data').textContent); const ALL_CATEGORIES=JSON.parse(document.getElementById('category-data').textContent); let selectedGens=new Set([1,2,3,4,5,6,7,8]); let POKEMON=ALL_POKEMON.filter(p=>selectedGens.has(p.gen)); let CATEGORIES=filterCategories();
let byId=new Map(ALL_POKEMON.map(p=>[p.id,p])); let rows=[], cols=[], cells=[], solved=new Map(), used=new Set(), errors=0;
function filterCategories(){const allowed=new Set(ALL_POKEMON.filter(p=>selectedGens.has(p.gen)).map(p=>p.id)); return ALL_CATEGORIES.map(c=>({...c, ids:c.ids.filter(id=>allowed.has(id))})).filter(c=>c.ids.length>=5);}
function rebuildFilteredData(){POKEMON=ALL_POKEMON.filter(p=>selectedGens.has(p.gen)); CATEGORIES=filterCategories();}
function seed(){ const d=new Date(); return Number(`${d.getFullYear()}${d.getMonth()+1}${d.getDate()}`)+('en'==='fr'?13:29); }
function rndFactory(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function intersection(a,b){const bset=new Set(b.ids); return a.ids.filter(id=>bset.has(id));}
function buildPuzzle(){const r=rndFactory(seed()+Math.floor(Math.random()*9999)); const pool=[...CATEGORIES].sort(()=>r()-.5); let best=null;
 for(let attempt=0;attempt<7000;attempt++){const picked=[]; const kinds=new Set(); for(const c of pool.sort(()=>r()-.5)){if(picked.length>=6)break; if(picked.some(x=>x.key===c.key))continue; if(kinds.has(c.kind)&&picked.length<4)continue; picked.push(c); kinds.add(c.kind);} if(picked.length<6)continue; const rr=picked.slice(0,3), cc=picked.slice(3,6); const ints=[]; let ok=true; for(const a of rr){for(const b of cc){const ids=intersection(a,b); if(ids.length<2){ok=false;break} ints.push(ids)} if(!ok)break} if(ok){best={rr,cc,ints};break}}
 if(!best){const p=pool.slice(0,6); best={rr:p.slice(0,3),cc:p.slice(3,6),ints:[]}; for(const a of p.slice(0,3))for(const b of p.slice(3,6))best.ints.push(intersection(a,b));}
 rows=best.rr; cols=best.cc; cells=best.ints; solved.clear(); used.clear(); errors=0; renderBoard(); updateErrors();}
function renderBoard(){const board=document.getElementById('board'); board.innerHTML=''; board.appendChild(div('corner',TXT.cross||'Row + column')); cols.forEach(c=>board.appendChild(div('header',c.label))); rows.forEach((row,ri)=>{board.appendChild(div('rowhead',row.label)); cols.forEach((col,ci)=>{const i=ri*3+ci; const el=document.createElement('article'); el.className='cell'; el.dataset.i=i; el.innerHTML=`<div class="count">${cells[i].length} ${TXT.matches}</div><div class="guess"><input placeholder="${TXT.placeholder}" autocomplete="off"><div class="suggest"></div></div><div class="result"></div>`; board.appendChild(el); wireCell(el,i);});}); document.getElementById('note').textContent=TXT.note||'';}
function div(cls,text){const d=document.createElement('div'); d.className=cls; d.textContent=text; return d;}
function wireCell(el,i){const input=el.querySelector('input'), sug=el.querySelector('.suggest'); let selected=null; input.addEventListener('input',()=>{selected=null; const q=normalize(input.value); if(!q){sug.style.display='none';return} const hits=POKEMON.filter(p=>p.search.includes(q)).slice(0,8); sug.innerHTML=hits.map(p=>`<div class="sug" data-id="${p.id}"><img src="${p.sprite}"><div><b>${p.name}</b><br><span>#${String(p.id).padStart(3,'0')} · ${p.typesLabel}</span></div></div>`).join(''); sug.style.display=hits.length?'block':'none'; sug.querySelectorAll('.sug').forEach(x=>x.onclick=()=>{selected=byId.get(Number(x.dataset.id));input.value=selected.name;sug.style.display='none';validate(el,i,selected)});}); input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); const p=selected||POKEMON.find(p=>normalize(p.name)===normalize(input.value)); validate(el,i,p)}}); input.addEventListener('blur',()=>{setTimeout(()=>{sug.style.display="none"},120)});}
function validate(el,i,p){if(!p) return toast(TXT.empty); if(used.has(p.id)) return toast(TXT.duplicate); if(cells[i].includes(p.id)){used.add(p.id); solved.set(i,p.id); el.classList.add('solved'); const r=el.querySelector('.result'); r.classList.remove('bad'); r.innerHTML=`<img src="${p.sprite}"><b>${p.name}</b><br><small>#${String(p.id).padStart(3,'0')} · ${p.typesLabel}</small><span class="matchDetails">${matchValues(i,p)}</span>`; if(solved.size===9){toast(TXT.win); showEnd(false);}} else {const r=el.querySelector('.result'); r.style.display='block'; r.classList.add('bad'); r.textContent=wrongMessage(p,i); addError();}}
function wrongMessage(p,i){const row=rows[Math.floor(i/3)], col=cols[i%3]; const checks=[row,col].map(c=>({cat:c,ok:c.ids.includes(p.id),detail:catDetail(c,p)})); const ok=checks.filter(x=>x.ok), bad=checks.filter(x=>!x.ok); if(ok.length&&bad.length){return `${p.name} ${TXT.is_ok_for||'matches'} ${ok.map(x=>x.cat.label).join(' + ')}, ${TXT.but||'but'} ${bad.map(x=>x.detail).join(' ; ')}.`} if(bad.length===2){return `${p.name} ${TXT.does_not_match||'does not match'} : ${bad.map(x=>x.detail).join(' ; ')}.`} return TXT.wrong;}
function fmtNum(x){return String(x).replace('.','en'==='fr'?',':'.')}
function mVal(p){return Number(String(p.height).replace(' m',''))}
function kgVal(p){return Number(String(p.weight).replace(' kg',''))}
function statLabel(k){const fr={'HP':'PV','Attack':'Attaque','Defense':'Défense','Sp. Attack':'Attaque Spé.','Sp. Defense':'Défense Spé.','Speed':'Vitesse'}; return 'en'==='fr'?(fr[k]||k):k;}
function catDetail(c,p){const k=c.key; const name=p.name; if(k.startsWith('gen_')) return `${name} ${'en'==='fr'?'est de génération':'is generation'} ${p.gen} (${c.label})`; if(k==='tall') return `${'en'==='fr'?'sa taille est':'height is'} ${p.height} (${c.label})`; if(k==='small') return `${'en'==='fr'?'sa taille est':'height is'} ${p.height} (${c.label})`; if(k==='heavy') return `${'en'==='fr'?'son poids est':'weight is'} ${p.weight} (${c.label})`; if(k==='light') return `${'en'==='fr'?'son poids est':'weight is'} ${p.weight} (${c.label})`; if(k.startsWith('type_')) return `${'en'==='fr'?'son type est':'type is'} ${p.typesLabel} (${c.label})`; if(k.startsWith('dual_')) return `${'en'==='fr'?'ses types sont':'types are'} ${p.typesLabel} (${c.label})`; const st=k.match(/^(HP|Attack|Defense|Sp\. Attack|Sp\. Defense|Speed)_(100|low)$/); if(st){return `${statLabel(st[1])} = ${p.base[st[1]]} (${c.label})`} if(k==='bst_500'||k==='bst_300') return `${'en'==='fr'?'son total de stats est':'base stat total is'} ${p.bst} (${c.label})`; if(k.startsWith('egg_')) return `${'en'==='fr'?'ses groupes œuf sont':'egg groups are'} ${p.egg.join(' / ')} (${c.label})`; if(k.startsWith('ability_')) return `${'en'==='fr'?'ses talents sont':'abilities are'} ${p.abilities.join(' / ')} (${c.label})`; if(k==='hidden') return `${'en'==='fr'?'talent caché':'hidden ability'}: ${p.hiddenAbilities.length?p.hiddenAbilities.join(' / '):('en'==='fr'?'aucun':'none')} (${c.label})`; if(k==='genderless'||k==='female_only'||k==='male_only') return `${'en'==='fr'?'son profil ne correspond pas à':'profile does not match'} ${c.label}`; if(k==='basic'||k==='middle'||k==='final'||k==='standalone'||k==='trade_evo'||k==='stone_evo') return `${'en'==='fr'?'sa ligne évolutive ne correspond pas à':'evolution line does not match'} ${c.label}`; if(k==='name_5'||k==='name_double') return `${'en'==='fr'?'son nom ne correspond pas à':'name does not match'} ${c.label}`; return `${'en'==='fr'?'ne correspond pas à':'does not match'} ${c.label}`;}
function reveal(){cells.forEach((ids,i)=>{if(solved.has(i))return; const el=document.querySelector(`.cell[data-i="${i}"]`); const p=byId.get(ids.find(id=>!used.has(id))||ids[0]); if(p){used.add(p.id); solved.set(i,p.id);} el.classList.add('solved'); const r=el.querySelector('.result'); r.classList.remove('bad'); r.innerHTML=`${TXT.answer}: <img src="${p.sprite}"><b>${p.name}</b><br><small>#${String(p.id).padStart(3,'0')} · ${p.typesLabel}</small><span class="matchDetails">${matchValues(i,p)}</span>`;}); showEnd(true);}
function catValue(c,p){const k=c.key; if(k.startsWith('gen_')) return `${'en'==='fr'?'Génération':'Generation'} ${p.gen}`; if(k==='tall'||k==='small') return `${'en'==='fr'?'Taille':'Height'} ${p.height}`; if(k==='heavy'||k==='light') return `${'en'==='fr'?'Poids':'Weight'} ${p.weight}`; if(k.startsWith('type_')||k.startsWith('dual_')) return `${'en'==='fr'?'Types':'Types'} ${p.typesLabel}`; const st=k.match(/^(HP|Attack|Defense|Sp\. Attack|Sp\. Defense|Speed)_(100|low)$/); if(st){return `${statLabel(st[1])} ${p.base[st[1]]}`} if(k==='bst_500'||k==='bst_300') return `${'en'==='fr'?'Total stats':'Base stat total'} ${p.bst}`; if(k.startsWith('egg_')) return `${'en'==='fr'?'Groupe œuf':'Egg group'} ${p.egg.join(' / ')}`; if(k.startsWith('ability_')) return `${'en'==='fr'?'Talents':'Abilities'} ${p.abilities.join(' / ')}`; if(k==='hidden') return `${'en'==='fr'?'Talent caché':'Hidden ability'} ${p.hiddenAbilities.join(' / ')}`; if(k==='genderless'||k==='female_only'||k==='male_only') return c.label; if(k==='basic') return `${'en'==='fr'?'Aucune pré-évolution':'No previous evolution'}`; if(k==='middle') return `${'en'==='fr'?'Évolution intermédiaire':'Middle evolution'}`; if(k==='final') return `${'en'==='fr'?'Évolution finale':'Final evolution'}`; if(k==='standalone') return `${'en'==='fr'?'Sans évolution':'No evolution line'}`; if(k==='trade_evo') return `${'en'==='fr'?'Évolution par échange':'Trade evolution'}`; if(k==='stone_evo') return `${'en'==='fr'?'Évolution par pierre':'Stone evolution'}`; if(k==='name_5'||k==='name_double') return p.name; return c.label;}
function matchValues(i,p){const row=rows[Math.floor(i/3)], col=cols[i%3]; return `${catValue(row,p)} · ${catValue(col,p)}`;}
function showEnd(revealed){const modal=document.getElementById('endModal'); const box=document.getElementById('allAnswers'); document.getElementById('endTitle').textContent=TXT.all_possible||TXT.possible_answers; box.innerHTML=''; cells.forEach((ids,i)=>{const row=rows[Math.floor(i/3)], col=cols[i%3]; const card=document.createElement('div'); card.className='answerCard'; const list=ids.map(id=>byId.get(id)).filter(Boolean).sort((a,b)=>a.id-b.id).map(p=>`<span class="answerPill"><img src="${p.sprite}">${p.name}</span>`).join(''); card.innerHTML=`<h3>${row.label} + ${col.label}<br><small>${ids.length} ${TXT.matches}</small></h3><div class="spoilerBox hidden"><div class="answerList">${list}</div><div class="spoilerCover">Spoiler</div></div>`; card.querySelector('.spoilerCover').onclick=()=>card.querySelector('.spoilerBox').classList.remove('hidden'); box.appendChild(card);}); modal.classList.add('open');}
document.addEventListener('click',e=>{if(e.target&&e.target.id==='closeModal')document.getElementById('endModal').classList.remove('open'); if(e.target&&e.target.id==='endModal')document.getElementById('endModal').classList.remove('open');});
function updateErrors(){const el=document.getElementById('errors'); const pill=document.getElementById('errorPill'); if(!el||!pill)return; el.textContent=errors; pill.classList.toggle('warn',errors===1||errors===2); pill.classList.toggle('danger',errors>=3);}
function addError(){errors=Math.min(3,errors+1); updateErrors(); const pill=document.getElementById('errorPill'); if(pill){pill.classList.remove('shake'); void pill.offsetWidth; pill.classList.add('shake');} if(errors>=3){toast('en'==='fr'?'3 erreurs. La grille est terminée.':'3 errors. Puzzle over.'); showEnd(false);}}
function normalize(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.__to);window.__to=setTimeout(()=>t.style.display='none',2200)}
function renderGenFilter(){const drop=document.getElementById('genDrop'); if(!drop)return; drop.innerHTML=Array.from({length:8},(_,i)=>i+1).map(g=>`<label><input type="checkbox" value="${g}" ${selectedGens.has(g)?'checked':''}> ${TXT.gen||'Gen'} ${g}</label>`).join('')+`<button class="genApply" id="genApply">${TXT.apply||'Apply'}</button>`; document.getElementById('genApply').onclick=()=>{const checked=[...drop.querySelectorAll('input:checked')].map(x=>Number(x.value)); if(!checked.length){toast('en'==='fr'?'Sélectionne au moins une génération.':'Select at least one generation.'); return;} selectedGens=new Set(checked); rebuildFilteredData(); drop.classList.remove('open'); buildPuzzle();};}
document.getElementById('genToggle').onclick=()=>{const drop=document.getElementById('genDrop'); renderGenFilter(); drop.classList.toggle('open');};
document.addEventListener('click',e=>{const gf=document.querySelector('.genFilter'); if(gf&&!gf.contains(e.target))document.getElementById('genDrop')?.classList.remove('open');});
document.getElementById('newGame').onclick=()=>{rebuildFilteredData(); buildPuzzle();}; document.getElementById('reveal').onclick=reveal; renderGenFilter(); buildPuzzle();
</script></body></html>
