function effectiveTypes(p){
 const h=TYPE_HISTORY[p.name]||TYPE_HISTORY[p.en]||TYPE_HISTORY[p.fr];
 if(!h)return (p.types||[]).map(typeKey);

function typeKey(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace('electric','electric').replace('électrik','electric').replace('electrik','electric').replace('psy','psychic').replace('vol','flying').replace('eau','water').replace('feu','fire').replace('plante','grass').replace('glace','ice').replace('combat','fighting').replace('sol','ground').replace('insecte','bug').replace('roche','rock').replace('spectre','ghost').replace('tenebres','dark').replace('acier','steel').replace('fee','fairy');}
function typeLabelFromKeys(keys){
 const labelsFr={normal:'Normal',fire:'Feu',water:'Eau',electric:'Électrik',grass:'Plante',ice:'Glace',fighting:'Combat',poison:'Poison',ground:'Sol',flying:'Vol',psychic:'Psy',bug:'Insecte',rock:'Roche',ghost:'Spectre',dragon:'Dragon',dark:'Ténèbres',steel:'Acier',fairy:'Fée'};

function rawPrevIds(p){const ev=p.rawEvolution||p.evolution||{}; const prev=ev.prev||ev.from; if(!prev)return []; if(Array.isArray(prev)&&prev.length)return [Number(prev[0])].filter(Boolean); return [];}
function rawNextIds(p){const ev=p.rawEvolution||p.evolution||{}; const next=ev.next||ev.to; if(!next)return []; if(Array.isArray(next))return next.map(x=>Array.isArray(x)?Number(x[0]):Number(x)).filter(Boolean); return [];}

function excludedEvolutionInfo(p){
 const selected=selectedPokemonIds();
 const excluded=[];
 rawPrevIds(p).forEach(id=>{
   if(!selected.has(id)){
     const g=ALL_POKEMON.find(x=>x.id===id)?.gen;
     if(g && !selectedGens.has(g)) excluded.push({type:'prev',gen:g});
   }
 });
 rawNextIds(p).forEach(id=>{
   if(!selected.has(id)){
     const g=ALL_POKEMON.find(x=>x.id===id)?.gen;
     if(g && !selectedGens.has(g)) excluded.push({type:'next',gen:g});
   }
 });

function evoStateMap(){const ids=selectedPokemonIds(); const state=new Map(); ALL_POKEMON.forEach(p=>state.set(p.id,{hasPrev:false,hasNext:false})); ALL_POKEMON.forEach(p=>{const pid=p.id; rawNextIds(p).forEach(nid=>{const srcGen=ALL_POKEMON.find(x=>x.id===pid)?.gen, dstGen=ALL_POKEMON.find(x=>x.id===nid)?.gen; const srcSelected=ids.has(pid), dstSelected=ids.has(nid); if(srcSelected&&dstSelected){state.get(pid).hasNext=true; state.get(nid).hasPrev=true;} else if(srcSelected && dstGen && selectedGens.has(dstGen)){state.get(pid).hasNext=true;} else if(dstSelected && srcGen && selectedGens.has(srcGen)){state.get(nid).hasPrev=true;}}); rawPrevIds(p).forEach(pre=>{const srcGen=ALL_POKEMON.find(x=>x.id===pre)?.gen, dstGen=ALL_POKEMON.find(x=>x.id===pid)?.gen; const srcSelected=ids.has(pre), dstSelected=ids.has(pid); if(srcSelected&&dstSelected){state.get(pre).hasNext=true; state.get(pid).hasPrev=true;} else if(dstSelected && srcGen && selectedGens.has(srcGen)){state.get(pid).hasPrev=true;} else if(srcSelected && dstGen && selectedGens.has(dstGen)){state.get(pre).hasNext=true;}});}); return state;}
function filterCategories(){const allowed=selectedPokemonIds(); const evo=evoStateMap(); return ALL_CATEGORIES.map(c=>{let ids=c.ids.filter(id=>allowed.has(id));
 if(c.key.startsWith('type_')){
   const t=c.key.replace('type_','');
   ids=[...allowed].filter(id=>effectiveTypes(byId.get(id)).includes(t));
 }
 if(c.key.startsWith('dual_')){
   const t=c.key.replace('dual_','');
   ids=[...allowed].filter(id=>{const et=effectiveTypes(byId.get(id)); return et.length>=2 && et.includes(t);});
 } if(c.key==='basic')ids=[...allowed].filter(id=>{const s=evo.get(id);return s&&!s.hasPrev&&s.hasNext}); if(c.key==='middle')ids=[...allowed].filter(id=>{const s=evo.get(id);return s&&s.hasPrev&&s.hasNext}); if(c.key==='final')ids=[...allowed].filter(id=>{const s=evo.get(id);return s&&s.hasPrev&&!s.hasNext}); if(c.key==='standalone')ids=[...allowed].filter(id=>{const s=evo.get(id);return s&&!s.hasPrev&&!s.hasNext}); return {...c,ids};}).filter(c=>{if(c.ids.length<5)return false; if(selectedGens.size===1 && c.key.startsWith('gen_')) return false; return true;});}

function seed(){ const d=new Date(); return Number(`${d.getFullYear()}${d.getMonth()+1}${d.getDate()}`)+('fr'==='fr'?13:29); }
function rndFactory(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function intersection(a,b){const bset=new Set(b.ids); return a.ids.filter(id=>bset.has(id));}
function hasDistinctSolution(groups){
  const ordered=groups.map((ids,idx)=>({ids:[...new Set(ids)],idx})).sort((a,b)=>a.ids.length-b.ids.length);
  const used=new Set();
  function dfs(pos){
    if(pos===ordered.length)return true;
    for(const id of ordered[pos].ids){
      if(used.has(id))continue;
      used.add(id);
      if(dfs(pos+1))return true;
      used.delete(id);
    }
    return false;
  }
  return dfs(0);
}
function buildPuzzle(){document.getElementById('winModal')?.classList.remove('open');document.getElementById('loseModal')?.classList.remove('open');document.getElementById('endModal')?.classList.remove('open');const r=rndFactory(seed()+Math.floor(Math.random()*9999)); const pool=[...CATEGORIES].sort(()=>r()-.5); let best=null;
 for(let attempt=0;attempt<7000;attempt++){const picked=[]; const kinds=new Set(); for(const c of pool.sort(()=>r()-.5)){if(picked.length>=6)break; if(picked.some(x=>x.key===c.key))continue; if(kinds.has(c.kind)&&picked.length<4)continue; picked.push(c); kinds.add(c.kind);} if(picked.length<6)continue; const rr=picked.slice(0,3), cc=picked.slice(3,6); const ints=[]; let ok=true; for(const a of rr){for(const b of cc){const ids=intersection(a,b); if(ids.length<2){ok=false;break} ints.push(ids)} if(!ok)break} if(ok&&hasDistinctSolution(ints)){best={rr,cc,ints};break}}
 if(!best){
  for(let attempt=0;attempt<12000&&!best;attempt++){
    const p=[...CATEGORIES].sort(()=>r()-.5).slice(0,6);
    const rr=p.slice(0,3), cc=p.slice(3,6), ints=[];
    let ok=true;
    const chosen=[...rr,...cc];
    for(let i=0;i<chosen.length;i++){
      for(let j=i+1;j<chosen.length;j++){
        const a=chosen[i], b=chosen[j];
        const sameType=(a.key.startsWith('type_')&&b.key.startsWith('dual_')&&a.key.replace('type_','')===b.key.replace('dual_',''))||(b.key.startsWith('type_')&&a.key.startsWith('dual_')&&b.key.replace('type_','')===a.key.replace('dual_',''));
        if(sameType){ok=false;break;}
      }
      if(!ok)break;
    }
    for(const a of rr){for(const b of cc){const ids=intersection(a,b); if(ids.length<2){ok=false;break} ints.push(ids)} if(!ok)break}
    if(ok&&hasDistinctSolution(ints))best={rr,cc,ints};
  }
}
if(!best){toast('fr'==='fr'?'Impossible de générer une grille avec ces générations.':'Could not generate a puzzle with these generations.'); return;}

function wireCell(el,i){const input=el.querySelector('input'), sug=el.querySelector('.suggest'); let selected=null; input.addEventListener('input',()=>{selected=null; const q=normalize(input.value); if(!q){sug.style.display='none';return} const hits=POKEMON.filter(p=>p.search.includes(q) && !used.has(p.id)).slice(0,8); const hideType=cellHasTypeCategory(i); sug.innerHTML=hits.map(p=>`<div class="sug" data-id="${p.id}"><img src="${p.sprite}"><div><b>${p.name}</b><br><span>#${String(p.id).padStart(3,'0')}${hideType?'':' · '+typeLabel(p)}</span></div></div>`).join(''); sug.style.display=hits.length?'block':'none'; sug.querySelectorAll('.sug').forEach(x=>x.onclick=()=>{selected=byId.get(Number(x.dataset.id));input.value=selected.name;sug.style.display='none';validate(el,i,selected)});}); input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); const p=selected||POKEMON.find(p=>normalize(p.name)===normalize(input.value)); validate(el,i,p)}}); input.addEventListener('blur',()=>{setTimeout(()=>{sug.style.display="none"},120)});}

function wrongMessage(p,i){

   }

   }

 const extraTxt=extra.length?' · '+extra.join(' ; '):'';
 if(ok.length&&bad.length){return `${p.name} ${TXT.is_ok_for||'matches'} ${ok.map(x=>x.cat.label).join(' + ')}, ${TXT.but||'but'} ${bad.map(x=>x.detail).join(' ; ')}${extraTxt}.`;}

function addError(){errors=Math.min(3,errors+1); updateErrors(); const pill=document.getElementById('errorPill'); if(pill){pill.classList.remove('shake'); void pill.offsetWidth; pill.classList.add('shake');} if(errors>=3){toast('fr'==='fr'?'3 erreurs. La grille est terminée.':'3 errors. Puzzle over.'); setTimeout(()=>showLose(),150);}}
function normalize(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.__to);window.__to=setTimeout(()=>t.style.display='none',2200)}
function renderGenFilter(){const drop=document.getElementById('genDrop'); if(!drop)return; drop.innerHTML=Array.from({length:9},(_,i)=>i+1).map(g=>`<label><input type="checkbox" value="${g}" ${selectedGens.has(g)?'checked':''}> ${TXT.gen||'Gen'} ${g}</label>`).join('')+`<button class="genApply" id="genApply">${TXT.apply||'Apply'}</button>`; document.getElementById('genApply').onclick=()=>{const checked=[...drop.querySelectorAll('input:checked')].map(x=>Number(x.value)); if(!checked.length){toast('fr'==='fr'?'Sélectionne au moins une génération.':'Select at least one generation.'); return;} selectedGens=new Set(checked); rebuildFilteredData(); drop.classList.remove('open'); buildPuzzle();};}
document.getElementById('genToggle').onclick=()=>{const drop=document.getElementById('genDrop'); renderGenFilter(); drop.classList.toggle('open');};
document.addEventListener('click',e=>{const gf=document.querySelector('.genFilter'); if(gf&&!gf.contains(e.target))document.getElementById('genDrop')?.classList.remove('open');});
document.getElementById('newGame').onclick=()=>{rebuildFilteredData(); buildPuzzle();}; document.getElementById('reveal').onclick=reveal; CATEGORIES=filterCategories(); renderGenFilter(); buildPuzzle();
</script></body></html>
